function svgNode(tag, attrs){

function decodeBoundary(encoded){
  const bytes = atob(encoded); let offset = 0, path = '';

    button.className = 'pick'; button.dataset.name = name;
    button.textContent = name; button.setAttribute('aria-pressed','false');
    button.addEventListener('click',() => openRoute(name,button)); buttons.append(button);
    const option = document.createElement('option'); option.value = name; option.textContent = name;
    $('district-select').append(option);
  });
  section.append(title,buttons); $('district-list').append(section);
});
function setView(city){
  $('district-map').setAttribute('viewBox',city?'130 245 250 190':'0 0 1000 560');
  $('map-stage').classList.toggle('city-mode',city);
  $('all-view').setAttribute('aria-pressed',String(!city));
  $('city-view').setAttribute('aria-pressed',String(city));
}
$('all-view').onclick = () => setView(false); $('city-view').onclick = () => setView(true);
$('district-select').onchange = event => {
  if(names.includes(event.target.value)) openRoute(event.target.value,event.target);
};
$('search').oninput = function(){
  const query = this.value.trim().replace(/^(臺中市|台中市)/,''); let total = 0;
  document.querySelectorAll('.group').forEach(section => {
    let count = 0;
    section.querySelectorAll('.pick').forEach(button => {
      button.hidden = !button.dataset.name.includes(query); if(!button.hidden) count++;
    });
    section.hidden = count===0; total += count;
  });
  $('no-results').hidden = total!==0;
};
function titleFor(name){return (name.length>2?name.slice(0,-1):name)+'物資運送路線';}
function sourceFor(name){
  const custom = IMAGE_URLS[name].trim();
  const base = IMAGE_BASE_URL.trim();
  if(!custom&&!base) return '';
  const raw = custom || base.replace(/\/?$/,'/')+encodeURIComponent(titleFor(name)+'.jpg');
  try{
    const url = new URL(raw,document.baseURI);
    return (url.protocol==='https:'||url.protocol==='http:'||url.protocol==='file:')?url.href:'';
  }catch(error){return '';}
}
function showMessage(text){$('message').textContent = text;$('message').hidden = false;}
function setReady(value){
  ready = value; document.querySelectorAll('.zoom').forEach(button => button.disabled = !value);
}
function openRoute(name,trigger){
  if(!names.includes(name)) return;
  if(overlay.hidden){
    opener = trigger || document.activeElement;
    scrollBefore = document.body.style.overflow;
    overlay.hidden = false; document.body.style.overflow = 'hidden';
    $('app').inert = true; $('close').focus();
  }
  current = names.indexOf(name); const request = ++token;
  if(pending){pending.onload = null; pending.onerror = null; pending = null;}
  setReady(false); fitted = true; drag = null; image.hidden = true; image.removeAttribute('src');
  $('zoom').textContent = '—'; $('space').style.width = ''; $('space').style.height = '';
  $('route-title').textContent = titleFor(name); image.alt = titleFor(name);
  $('counter').textContent = (current+1)+' / '+names.length;
  $('selection').textContent = '已選取：'+name; $('district-select').value = name;
  document.querySelectorAll('[data-name]').forEach(el => el.setAttribute('aria-pressed',String(el.dataset.name===name)));
  const src = sourceFor(name); $('original').hidden = !src;
  if(!src){$('original').removeAttribute('href');showMessage('本區路線圖尚未提供。');return;}
  $('original').href = src; showMessage('正在載入路線圖…');
  const loader = new Image(); pending = loader;
  loader.id = 'route-image'; loader.className = 'route-image';
  loader.alt = titleFor(name); loader.draggable = false;
  loader.onload = function(){
    if(request!==token||overlay.hidden) return;
    image.replaceWith(loader); image = loader; image.hidden = false; $('message').hidden = true;
    setReady(true); pending = null; requestAnimationFrame(fitImage);
  };
  loader.onerror = function(){
    if(request!==token||overlay.hidden) return;
    pending = null; showMessage('路線圖無法載入，請稍後重試，或點選「開啟原圖」。');
  };
  loader.src = src;
}
function closeViewer(){
  token++; if(pending){pending.onload = null;pending.onerror = null;pending = null;}
  overlay.hidden = true; document.body.style.overflow = scrollBefore;
  $('app').inert = false; drag = null;
  if(opener&&opener.isConnected) opener.focus({preventScroll:true});
}
$('close').onclick = closeViewer;
overlay.addEventListener('click',event => {if(event.target===overlay) closeViewer();});
function step(delta){if(current>=0) openRoute(names[(current+delta+names.length)%names.length]);}
$('previous').onclick = () => step(-1); $('next').onclick = () => step(1);
function fitScale(){return Math.max(.01,Math.min((viewport.clientWidth-32)/image.naturalWidth,(viewport.clientHeight-32)/image.naturalHeight,1));}
function resizeImage(next,center){
  if(!ready||!image.naturalWidth) return;
  const oldW = $('space').offsetWidth, oldH = $('space').offsetHeight;
  const x = (viewport.scrollLeft+viewport.clientWidth/2)/oldW;
  const y = (viewport.scrollTop+viewport.clientHeight/2)/oldH;
  scale = Math.max(fitScale()*.5,Math.min(next,4));
  const width = Math.round(image.naturalWidth*scale), height = Math.round(image.naturalHeight*scale);
  image.style.width = width+'px'; image.style.height = height+'px';
  $('space').style.width = (width+32)+'px'; $('space').style.height = (height+32)+'px';
  $('zoom').textContent = Math.round(scale*100)+'%';
  if(center){viewport.scrollLeft = x*$('space').offsetWidth-viewport.clientWidth/2;viewport.scrollTop = y*$('space').offsetHeight-viewport.clientHeight/2;}
}
function fitImage(){if(!ready) return;fitted = true;resizeImage(fitScale(),false);viewport.scrollLeft = 0;viewport.scrollTop = 0;}
$('fit').onclick = fitImage;
$('plus').onclick = () => {fitted = false;resizeImage(scale*1.4,true);};
$('minus').onclick = () => {fitted = false;resizeImage(scale/1.4,true);};
let resizeFrame;
window.addEventListener('resize',() => {
  cancelAnimationFrame(resizeFrame);resizeFrame = requestAnimationFrame(() => {
    if(!overlay.hidden&&ready){if(fitted) fitImage();else resizeImage(scale,true);}
  });
});
document.addEventListener('keydown',event => {
  if(overlay.hidden) return;
  if(event.key==='Escape'){event.preventDefault();closeViewer();return;}
  if(event.key==='ArrowLeft'){event.preventDefault();step(-1);}
  if(event.key==='ArrowRight'){event.preventDefault();step(1);}
  if(event.key==='Tab'){
    const focusable = [...overlay.querySelectorAll('button:not(:disabled),a[href]')].filter(el => !el.hidden);
    const first = focusable[0], last = focusable[focusable.length-1];
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
  }
});
viewport.addEventListener('pointerdown',event => {
  if(event.pointerType!=='mouse'||event.button!==0||!ready) return;
  drag = {id:event.pointerId,x:event.clientX,y:event.clientY,left:viewport.scrollLeft,top:viewport.scrollTop};
  viewport.setPointerCapture(event.pointerId);event.preventDefault();
});
viewport.addEventListener('pointermove',event => {
  if(drag&&event.pointerId===drag.id){viewport.scrollLeft = drag.left+drag.x-event.clientX;viewport.scrollTop = drag.top+drag.y-event.clientY;}
});
['pointerup','pointercancel','lostpointercapture'].forEach(type => viewport.addEventListener(type,() => {drag = null;}));
})();
</script>
</body>
